name: CI

on:
  pull_request:
  push:
    # develop is where the work lands; main only moves by release
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected compares against the last green commit, so it needs history
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
        with:
          # a push compares with the last green run of its own branch, a pull request with its target
          main-branch-name: ${{ github.event_name == 'push' && github.ref_name || github.base_ref }}
      - run: pnpm exec oxfmt --check
      - run: pnpm run affected
      - run: pnpm --filter @lc/stand exec playwright install --with-deps chromium
      - run: pnpm run stand:test
