packages:
  - apps/*
  - modules/*
  - packages/*

# One version of each shared dependency for the whole workspace: packages reference these as `catalog:`.
catalog:
  '@inlang/paraglide-js': 3.2.2
  '@storybook/addon-a11y': 10.6.8
  '@storybook/addon-docs': 10.6.8
  '@storybook/addon-vitest': 10.6.8
  '@storybook/react-vite': 10.6.8
  '@tailwindcss/vite': 4.3.5
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.3.0
  '@vitest/browser': 5.1.1
  '@vitest/browser-playwright': 5.1.1
  playwright: 1.65.1
  react: 19.3.1
  react-dom: 19.3.1
  storybook: 10.6.8
  tailwindcss: 4.3.5
  tsx: 4.23.15
  vite: 8.3.8
  vitest: 5.1.1

allowBuilds:
  esbuild: true
  nx: true
